name: Setup Development Environment
description: Setup Nix, devenv, and install dependencies

inputs:
  github-token:
    description: GitHub token for Nix installation
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
      with:
        github_access_token: ${{ inputs.github-token }}
    - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: devenv
    - name: Install by devenv
      shell: bash
      run: |
        nix profile install nixpkgs#devenv
        devenv shell echo
